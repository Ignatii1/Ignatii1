<title>Программист 1С — прогресс обучения</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F7F5EF; --surface:#FFFFFF; --line:#E3DFD1; --track:#EAE6D8;
  --text:#17150F; --muted:#6E6A5E; --accent:#F2B705; --accent-ink:#17150F;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12110D; --surface:#1C1A15; --line:#2E2B22; --track:#26241C;
    --text:#F5F2E8; --muted:#948E7E; --accent:#FFC916; --accent-ink:#17150F;
  }
}
:root[data-theme="dark"]{
  --bg:#12110D; --surface:#1C1A15; --line:#2E2B22; --track:#26241C;
  --text:#F5F2E8; --muted:#948E7E; --accent:#FFC916; --accent-ink:#17150F;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased}
.wrap{max-width:820px; margin:0 auto; padding:0 20px}
canvas{position:fixed; inset:0; pointer-events:none; z-index:9}

/* ── счёт ─────────────────────────────────────────── */
.hero{padding:34px 0 22px}
.big{
  font:600 clamp(64px,17vw,116px)/.85 var(--mono); letter-spacing:-.05em;
  font-variant-numeric:tabular-nums; display:block; transition:transform .18s cubic-bezier(.3,1.6,.5,1);
}
.big.pop{transform:scale(1.09)}
.sum{margin:10px 0 0; font-size:15px; color:var(--muted)}
.sum b{color:var(--text); font-weight:600}
.cells{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(13px,1fr));
  gap:4px; margin-top:20px;
}
.cell{aspect-ratio:1; border-radius:2px; background:var(--track); transition:background .2s, transform .2s}
.cell.on{background:var(--accent)}
.cell.pop{transform:scale(1.5)}
.cell.next{box-shadow:inset 0 0 0 2px var(--accent)}

/* ── следующий шаг ────────────────────────────────── */
.now{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:20px; margin-top:26px; display:grid; gap:14px;
}
.eyebrow{font:600 11px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.now .mod{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:-4px}
.now .topic{font-size:22px; font-weight:600; line-height:1.25; text-wrap:balance}
.go{
  justify-self:start; border:0; border-radius:10px; padding:13px 24px; cursor:pointer;
  background:var(--accent); color:var(--accent-ink);
  font:600 16px var(--sans); transition:transform .12s;
}
.go:hover{transform:translateY(-1px)}
.go:active{transform:translateY(1px)}
.go:focus-visible,.copy:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── модули ───────────────────────────────────────── */
h2{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:34px 0 10px}
details{background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:8px}
summary{
  position:relative; display:grid; grid-template-columns:auto 1fr auto auto;
  align-items:center; gap:12px; padding:13px 14px; cursor:pointer; list-style:none; border-radius:10px;
}
summary::-webkit-details-marker{display:none}
.num{font-family:var(--mono); font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:2px 6px}
.done .num{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.name{font-size:15px; font-weight:500}
.done .name{color:var(--muted)}
.count{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.chev{color:var(--muted); font-size:13px; transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.mini{position:absolute; left:14px; right:14px; bottom:0; height:2px; background:var(--track)}
.mini i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s}
ul{list-style:none; margin:0; padding:4px 14px 12px; border-top:1px solid var(--line)}
li label{display:flex; gap:10px; align-items:flex-start; padding:7px 2px; cursor:pointer}
input[type=checkbox]{margin:3px 0 0; accent-color:var(--accent); width:16px; height:16px; flex:none}
label span{font-size:14.5px}
input:checked + span{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line)}

/* ── перенос прогресса ────────────────────────────── */
.sync{margin:34px 0 60px; padding-top:18px; border-top:1px solid var(--line)}
.row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
#code{
  flex:1 1 260px; min-width:0; font-family:var(--mono); font-size:13px; padding:10px 12px;
  border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text);
}
.copy{
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  border-radius:8px; padding:10px 16px; cursor:pointer; font:500 14px var(--sans);
}
.hint{color:var(--muted); font-size:13px; margin:10px 0 0}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); z-index:10;
  background:var(--text); color:var(--bg); padding:11px 18px; border-radius:999px;
  font:500 14px var(--sans); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<div class="wrap">
  <div class="hero">
    <span class="big" id="pct">0%</span>
    <p class="sum" id="sum" aria-live="polite"></p>
    <div class="cells" id="cells"></div>
  </div>

  <section class="now">
    <div class="eyebrow">Сейчас</div>
    <div class="mod" id="nowMod"></div>
    <div class="topic" id="nowTopic"></div>
    <button class="go" id="go">Готово ✓</button>
  </section>

  <h2>Все модули</h2>
  <div id="mods"></div>

  <div class="sync">
    <div class="eyebrow">Прогресс на другом устройстве</div>
    <div class="row">
      <input id="code" spellcheck="false" aria-label="Код прогресса">
      <button class="copy" id="copy">Скопировать</button>
    </div>
    <p class="hint">Код меняется на каждой галочке. Вставь его в заметку Obsidian — и вставь оттуда сюда в другом браузере, чтобы поднять тот же прогресс.</p>
  </div>
</div>

["Интеграция и обмен данными",[

["Командная разработка в 1С",[
  "Создание хранилища конфигурации и подключение к нему",

  "Особенности работы с конфигурацией на поддержке хранилища",
  "1C:Enterprise Development Tools (EDT)"]],
["Финальное задание",[
  "Задачи из экзамена 1С:Специалист по платформе",
  "Разработка конфигурации для учета на предприятии"]]
];

const FLAT = M.flatMap(([mod, topics], m) => topics.map(t => ({m, mod, t})));
const N = FLAT.length;
const OFF = M.map((_, m) => FLAT.findIndex(f => f.m === m)); // индекс первой темы модуля
const KEY = "1c-progress-v2";
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
const pctOf = (d, t) => t ? Math.round(d / t * 100) : 0;

// ponytail: состояние — битовая маска в base64url. Индекс = позиция темы в FLAT,
// то есть правка списка тем сдвинет старые коды. Понадобится стабильность — хранить id тем.
const enc = set => {
  const b = new Uint8Array(Math.ceil(N / 8));
  set.forEach(i => b[i >> 3] |= 1 << (i & 7));
  return btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const dec = s => {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  const set = new Set();
  for (let i = 0; i < N; i++) if (bin.charCodeAt(i >> 3) & (1 << (i & 7))) set.add(i);
  return set;
};

let done = new Set();
try {
  const h = location.hash.slice(1);
  const start = (h && h !== "test" ? h : localStorage.getItem(KEY)) || "";
  if (start) done = dec(start);
} catch { done = new Set(); }

// разметка
cells.innerHTML = FLAT.map((f, i) =>
  `<div class="cell" data-i="${i}" title="${String(f.m + 1).padStart(2, "0")} · ${f.t}"></div>`).join("");
mods.innerHTML = M.map(([name, topics], m) => `
<details>
  <summary>
    <span class="num">${String(m + 1).padStart(2, "0")}</span>
    <span class="name">${name}</span>
    <span class="count"></span>
    <span class="chev">›</span>
    <span class="mini"><i></i></span>
  </summary>
  <ul>${topics.map((t, j) =>
    `<li><label><input type="checkbox" data-i="${OFF[m] + j}"><span>${t}</span></label></li>`
  ).join("")}</ul>
</details>`).join("");

const boxes = [...mods.querySelectorAll("input")];
const cellEls = [...cells.children];

function refresh() {
  boxes.forEach(b => b.checked = done.has(+b.dataset.i));
  cellEls.forEach((c, i) => c.classList.toggle("on", done.has(i)));

  M.forEach(([, topics], m) => {
    const n = topics.filter((_, j) => done.has(OFF[m] + j)).length;
    const d = mods.children[m];
    d.querySelector(".count").textContent = `${n}/${topics.length}`;
    d.querySelector(".mini i").style.width = pctOf(n, topics.length) + "%";
    d.classList.toggle("done", n === topics.length);
  });

  const p = pctOf(done.size, N);
  pct.textContent = p + "%";
  sum.innerHTML = `<b>${done.size}</b> из ${N} тем · осталось ${N - done.size}`;

  const next = FLAT.findIndex((_, i) => !done.has(i));
  cellEls.forEach((c, i) => c.classList.toggle("next", i === next));
  if (next < 0) {
    nowMod.textContent = "";
    nowTopic.textContent = "Курс пройден полностью 🎉";
    go.hidden = true;
  } else {
    go.hidden = false;
    nowMod.textContent = `Модуль ${String(FLAT[next].m + 1).padStart(2, "0")} · ${FLAT[next].mod}`;
    nowTopic.textContent = FLAT[next].t;
  }
  code.value = enc(done);
  return next;
}

function save() {
  const s = enc(done);
  try { localStorage.setItem(KEY, s); } catch {}
  history.replaceState(null, "", "#" + s);
}

function toggle(i, el) {
  const adding = !done.has(i);
  adding ? done.add(i) : done.delete(i);
  const m = FLAT[i].m;
  const modDone = M[m][1].every((_, j) => done.has(OFF[m] + j));
  save();
  refresh();
  if (!adding) return;

  const r = (el || cellEls[i]).getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, modDone ? 90 : 30);
  cellEls[i].classList.add("pop");
  pct.classList.add("pop");
  setTimeout(() => { cellEls[i].classList.remove("pop"); pct.classList.remove("pop"); }, 220);
  if (modDone) say(`Модуль ${String(m + 1).padStart(2, "0")} закрыт целиком 🎉`);
  else if (done.size === N) say("Курс пройден 🎉");
}

go.onclick = () => { const i = refresh(); if (i >= 0) toggle(i, go); };
mods.addEventListener("change", e => toggle(+e.target.dataset.i, e.target));
copy.onclick = async () => {
  code.select();
  try { await navigator.clipboard.writeText(code.value); say("Код скопирован"); }
  catch { say("Код выделен — скопируй вручную"); }
};
code.addEventListener("change", () => {
  try { done = dec(code.value.trim()); save(); refresh(); say("Прогресс загружен"); }
  catch { say("Код не распознан"); refresh(); }
});

let tid;
function say(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(tid);
  tid = setTimeout(() => toast.classList.remove("show"), 2400);
}

// конфетти
const ctx = fx.getContext("2d");
const fit = () => { fx.width = innerWidth; fx.height = innerHeight; };
addEventListener("resize", fit); fit();
let parts = [], running = false;
function burst(x, y, n) {
  if (reduced) return;
  for (let i = 0; i < n; i++) parts.push({
    x, y, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 3,
    w: 3 + Math.random() * 5, a: 1,
    c: ["#F2B705", "#FFD84D", "#FF8A3D", "#7BC950", "#4DA3FF"][i % 5]
  });
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  ctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.a > 0 && p.y < fx.height + 40);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += .45; p.a -= .014;
    ctx.globalAlpha = Math.max(p.a, 0);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x, p.y, p.w, p.w * .7);
  }
  ctx.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(tick); else running = false;
}

refresh();
